[package]
name = "freeport-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Freeport 桌面宿主"

[lib]
name = "freeport_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freeport-core = { path = "../crates/freeport-core" }
freeport-gateway = { path = "../crates/freeport-gateway" }
freeport-inject = { path = "../crates/freeport-inject" }
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
