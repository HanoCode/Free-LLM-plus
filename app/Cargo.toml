[workspace]
members = [
    "crates/freeport-core",
    "crates/freeport-catalog",
    "crates/freeport-catalogd",
    "crates/freeport-probe",
    "crates/freeport-inject",
    "crates/freeport-auth",
    "crates/freeport-license",
    "crates/freeport-ext",
    "crates/freeport-gateway",
    "crates/freeport-mcp",
    "crates/freeport-daemon",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
futures-util = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
dirs = "5"

[profile.dev]
opt-level = 0
codegen-units = 256
incremental = true

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = "symbols"
panic = "unwind"
