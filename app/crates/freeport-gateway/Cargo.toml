[package]
name = "freeport-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Freeport 的数据面：HTTP 入口、失败接力、流式转发。"

[dependencies]
freeport-core = { path = "../freeport-core" }
freeport-catalog = { path = "../freeport-catalog" }
freeport-probe = { path = "../freeport-probe" }
freeport-auth = { path = "../freeport-auth" }
freeport-license = { path = "../freeport-license" }
freeport-ext = { path = "../freeport-ext" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
aes-gcm = "0.10"
argon2 = { workspace = true }
rand = "0.8"
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# 只在测试里签名：发布包不含私钥相关代码
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
# 测试要能自己签发许可证；`issuer` 只在这个测试构建里打开
freeport-license = { path = "../freeport-license", features = ["issuer"] }
# 端到端跑真实的目录服务端：客户端与服务端的判定必须对得上，
# 各测各的等于两份实现互相背书
freeport-catalogd = { path = "../freeport-catalogd" }
axum = { workspace = true }
