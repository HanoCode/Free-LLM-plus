[package]
name = "freeport-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Freeport 的厂商与模型目录：内置基线 + models.dev 增量 + 免费判定。"

[dependencies]
freeport-core = { path = "../freeport-core" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# 只做验签。签名（私钥）只在 examples/sign_feed.rs 里，不进发布包。
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }

[dev-dependencies]
tokio = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
