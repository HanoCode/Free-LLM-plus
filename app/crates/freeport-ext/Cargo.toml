[package]
name = "freeport-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Freeport 的扩展宿主：manifest 校验、验签、sidecar 进程管理（ASR / 图片生成）。"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "io-std"] }
axum = { workspace = true, features = ["multipart"] }
reqwest = { workspace = true, features = ["multipart"] }
futures-util = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# 只做验签。签名（私钥）只在 examples/sign_builtin.rs 里，不进发布包。
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
# 私钥相关代码只在这个 feature 下编译；发布包不含私钥
issuer = ["ed25519-dalek/rand_core"]
